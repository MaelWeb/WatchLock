<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>WatchLock 设计稿 · 设置 / 设备</title><link rel="stylesheet" href="mockups.css"></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="gear" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.6"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1"/></symbol>
<symbol id="watch" viewBox="0 0 16 16"><rect x="4.6" y="4" width="6.8" height="8" rx="2.4"/><path d="M6.2 4V1.8h3.6V4M6.2 12v2.2h3.6V12"/></symbol>
<symbol id="lockopen" viewBox="0 0 16 16"><rect x="3.4" y="7" width="9.2" height="7" rx="2"/><path d="M5.8 7V5.4a2.2 2.2 0 0 1 4.2-.8"/></symbol>
<symbol id="ruler" viewBox="0 0 16 16"><rect x="1.4" y="5.4" width="13.2" height="5.2" rx="1.2"/><path d="M4.6 5.4v2M7.2 5.4v2.6M9.8 5.4v2M12.4 5.4v2.6"/></symbol>
<symbol id="steth" viewBox="0 0 16 16"><path d="M4 2.5v4a2.6 2.6 0 0 0 5.2 0v-4"/><circle cx="11.6" cy="10.4" r="2.2"/><path d="M9.2 8.6l1 1"/></symbol>
<symbol id="info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.4v4M8 5.2v.5"/></symbol>
<symbol id="trash" viewBox="0 0 16 16"><path d="M3.6 4.6h8.8M6.2 4.6V3h3.6v1.6M5 4.6l.6 8.2h4.8L11 4.6"/></symbol>
<symbol id="wave" viewBox="0 0 16 16"><path d="M2 9c1.4 0 1.4-4 2.8-4s1.4 8 2.8 8 1.4-8 2.8-8 1.4 4 2.8 4"/></symbol>
</defs></svg>

<div class="col">
<div class="window chrome">
  <div class="lights float"><span class="light r"></span><span class="light y"></span><span class="light g"></span></div>
  <div class="split">
    <div class="sidebar">
<div class="side-brand"><img src="AppIcon-master.png" alt=""><span>WatchLock</span></div>
      <div class="side-item"><svg class="ic"><use href="#gear"/></svg>通用</div>
      <div class="side-item on"><svg class="ic"><use href="#watch"/></svg>设备</div>
      <div class="side-item"><svg class="ic"><use href="#lockopen"/></svg>解锁</div>
      <div class="side-item"><svg class="ic"><use href="#ruler"/></svg>校准</div>
      <div class="side-item"><svg class="ic"><use href="#steth"/></svg>诊断</div>
      <div class="side-sep"></div>
      <div class="side-item"><svg class="ic"><use href="#info"/></svg>关于</div>
    </div>
    <div class="detail">
      <div class="card row" style="gap:12px">
        <svg class="ic lg" style="color:#34c759;width:20px;height:20px"><use href="#watch"/></svg>
        <div class="stack gap4" style="flex:1">
          <div class="sub">已绑定</div>
          <div class="label" style="font-weight:600">Apple Watch</div>
        </div>
        <div class="btn d"><svg class="ic"><use href="#trash"/></svg>解除绑定</div>
      </div>

      <div class="card mt12">
        <div class="row" style="gap:8px">
          <div class="h" style="font-size:13px">附近设备（按信号排序）</div>
          <div class="sp"></div>
          <div class="btn sm">重新扫描</div>
        </div>
        <div class="list mt8">
          <div class="list-row">
            <svg class="ic" style="color:#8e8e93"><use href="#watch"/></svg>
            <div class="stack gap4" style="flex:1">
              <div class="t">Apple Watch</div>
              <div class="s">名称 · 厂商数据</div>
            </div>
            <div class="meter"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span></div>
            <div class="s num" style="width:56px;text-align:right">-48 dBm</div>
            <div class="btn sm" style="opacity:.45">已绑定</div>
          </div>
          <div class="list-row">
            <svg class="ic" style="color:#8e8e93"><use href="#watch"/></svg>
            <div class="stack gap4" style="flex:1">
              <div class="t">未命名设备 A1B2…</div>
              <div class="s">靠近 Mac（按信号排序）</div>
            </div>
            <div class="meter"><span class="warn"></span><span class="warn"></span><span></span><span></span></div>
            <div class="s num" style="width:56px;text-align:right">-72 dBm</div>
            <div class="btn sm">绑定</div>
          </div>
        </div>
        <div class="cap mt8">把手表贴近 Mac，最靠前的那台通常就是它。名称不是必需条件，绑定后按设备标识追踪。</div>
      </div>

      <div class="row mt12" style="gap:6px">
        <span class="cap">扫描中</span><span class="cap">·</span><span class="cap">蓝牙：已开启</span><span class="cap">·</span>
        <span class="cap">记录 5 台</span><span class="cap">·</span><span class="cap">已收到 128 条广播</span>
      </div>
    </div>
  </div>
</div>
<div class="caption">设备 · 空态时列表区域替换为 ContentUnavailableView（不再 overlay 叠加）；解除绑定需二次确认</div>
</div>
</body>
</html>
